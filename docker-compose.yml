version: '3.8'

services:
  assistant-app:
    build: .
    container_name: contextual-tool-assistant
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./agent_state.sqlite:/app/agent_state.sqlite
    environment:
      - STATE_DB_PATH=/app/agent_state.sqlite
    restart: unless-stopped
